# NOT APPLIED, and the reason is narrower than "it would break".
#
# Scaling to two pods on one node works: measured, both serve, both read the
# same SQLite file through the same ReadWriteOnce volume, 40 concurrent writes
# with no lock errors. The application has no per-session memory to lose.
#
# What it cannot do is scale across NODES, which is the only kind of scaling
# an HPA is for on a real cluster. A ReadWriteOnce volume is mountable by one
# node at a time, so the second node's pod never schedules; giving it a
# ReadWriteMany volume instead moves SQLite onto a network filesystem, where
# its locking is advisory and two writers corrupt rather than contend.
#
# So this is one change away from being correct, not a rewrite:
#   move the chat history from SQLite to Postgres.
# Then the volume goes, replicas > 1 is safe on any topology, RollingUpdate
# replaces Recreate, and this file applies unchanged.
#
# It is committed now because the thresholds below were chosen rather than
# copied, and they are the part worth reviewing.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aardvark
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aardvark
  minReplicas: 1
  maxReplicas: 4

  metrics:
    # CPU, not requests-per-second. A research turn is 20 to 60 seconds and
    # spends most of it waiting on someone else's API, so request rate says
    # almost nothing about whether this pod is struggling. The CPU it does burn
    # is the embedding pass, which is the part that actually saturates.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      # No stabilisation window: a queue forming is worth reacting to at once.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      # Ten minutes, and the number comes from the workload rather than taste.
      # A new pod pays a cold start: image pull, then the embedding model
      # warmup that readiness gates on. Scaling down a pod that is about to be
      # needed again buys back a little memory and costs a user thirty seconds.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
