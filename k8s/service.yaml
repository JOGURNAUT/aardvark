apiVersion: v1
kind: Service
metadata:
  name: aardvark
  labels: { app: aardvark }
spec:
  type: ClusterIP
  selector: { app: aardvark }
  ports:
    - name: http
      port: 80
      targetPort: http

  # No sessionAffinity, deliberately.
  #
  # An earlier version of this file set ClientIP on the theory that a session
  # lives in the process that created it. That is true of the Streamlit UI and
  # false of the one actually served: the FastAPI path keeps nothing per-session
  # in memory, the client holds the session id, and every turn is read back from
  # SQLite. Verified by putting two pods behind this Service and creating 40
  # sessions through it - both pods then read all 40.
  #
  # Pinning users to pods for no reason costs real things: it unbalances load,
  # it breaks behind a NAT that collapses many clients to one source address,
  # and it makes a rescheduled pod look like a lost session.
