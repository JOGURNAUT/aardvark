# TEMPLATE. Do not put real keys in this file: it is committed.
#
# Create the real Secret from the .env that is already gitignored:
#
#   kubectl create secret generic aardvark-secrets --from-env-file=.env
#
# That reads the same file the container already uses locally, so there is one
# place keys live and no second copy to forget about. `kubectl create` also
# base64-encodes for you, which is worth saying out loud: base64 is encoding,
# not encryption. A Kubernetes Secret is only as private as read access to the
# namespace, which is why real clusters put an external secrets manager or
# encryption-at-rest in front of it.

apiVersion: v1
kind: Secret
metadata:
  name: aardvark-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "replace-me"
  GEMINI_API_KEY: "replace-me"
  TAVILY_API_KEY: "replace-me"
